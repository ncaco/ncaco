  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a36"/><stop offset="1" stop-color="#24204b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#64d8f3"/><stop offset="1" stop-color="#aa91ff"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
